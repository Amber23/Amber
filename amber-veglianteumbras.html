<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vegliante</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond&display=swap" rel="stylesheet">
<style>
body{background:#050404;margin:0;padding:0;}
.giro{transform-origin:300px 300px;animation:giro 160s linear infinite;}
.controgiro{transform-origin:300px 300px;animation:giro 240s linear infinite reverse;}
@keyframes giro{to{transform:rotate(360deg);}}
@media (prefers-reduced-motion:reduce){.giro,.controgiro{animation:none;}}
</style>
</head>
<body>
<div style="background:#050404 radial-gradient(ellipse at 50% 50%,#1a0507 0%,#050404 60%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px 0;box-sizing:border-box;">
<div style="position:relative;width:600px;height:600px;margin:0 auto;">
<svg width="600" height="600" viewBox="0 0 600 600" style="position:absolute;left:0;top:0;" aria-hidden="true">
<defs>
<radialGradient id="alone" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#5c0a12" stop-opacity=".55"/><stop offset=".55" stop-color="#2a0508" stop-opacity=".35"/><stop offset="1" stop-color="#050404" stop-opacity="0"/></radialGradient>
<path id="anello" d="M300,300 m-277,0 a277,277 0 1,1 554,0 a277,277 0 1,1 -554,0"/>
</defs>
<circle cx="300" cy="300" r="300" fill="url(#alone)"/>
<circle cx="300" cy="300" r="292" fill="none" stroke="#6e0a12" stroke-width="1.5"/>
<circle cx="300" cy="300" r="266" fill="none" stroke="#c0242f" stroke-width=".8"/>
<g class="giro">
<text font-family="'EB Garamond',serif" font-size="14" letter-spacing="3" fill="#c0242f"><textPath href="#anello" textLength="1735" lengthAdjust="spacing">DVM DORMIVNT VIGILO ✠ QVOD VIDET VMBRA NON OBLIVISCITVR ✠ DVM DORMIVNT VIGILO ✠ QVOD VIDET VMBRA NON OBLIVISCITVR ✠</textPath></text>
</g>
<g class="controgiro" stroke="#c0242f" fill="none">
<circle cx="300" cy="300" r="252" stroke-width=".6" stroke-dasharray="2 6"/>
<polygon points="300,58 489,149 536,354 405,518 195,518 64,354 111,149" stroke-width=".7" opacity=".55"/>
<polygon points="300,58 405,518 111,149 536,354 195,518 489,149 64,354" stroke-width=".9" opacity=".8"/>
<g fill="#050404" stroke-width="1"><circle cx="300" cy="58" r="7"/><circle cx="489" cy="149" r="7"/><circle cx="536" cy="354" r="7"/><circle cx="405" cy="518" r="7"/><circle cx="195" cy="518" r="7"/><circle cx="64" cy="354" r="7"/><circle cx="111" cy="149" r="7"/></g>
<g fill="#c0242f" stroke="none"><circle cx="300" cy="58" r="2"/><circle cx="489" cy="149" r="2"/><circle cx="536" cy="354" r="2"/><circle cx="405" cy="518" r="2"/><circle cx="195" cy="518" r="2"/><circle cx="64" cy="354" r="2"/><circle cx="111" cy="149" r="2"/></g>
</g>
<circle cx="300" cy="300" r="214" fill="none" stroke="#6e0a12" stroke-width="1"/>
</svg>
<div style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);">
<div class="cornice" data-maxw="320" data-maxh="420" style="background:#0b0a09;border:1px solid #c0242f;outline:1px solid #6b6457;outline-offset:5px;overflow:hidden;position:relative;width:280px;height:400px;">
<img src="https://i.postimg.cc/GmBm5ZKX/963ab28bd29ade3987995fd5f39a9594.jpg" alt="Il Vegliante" style="display:block;width:100%;height:100%;object-fit:cover;">
<div style="position:absolute;inset:0;box-shadow:inset 0 0 50px 6px #050404;"></div>
</div>
</div>
</div>
</div>
<script>
/* ogni cornice prende le proporzioni della sua immagine, entro il riquadro massimo indicato */
document.querySelectorAll('.cornice').forEach(function (c) {
  var img = c.querySelector('img');
  function adatta() {
    var r = img.naturalWidth / img.naturalHeight;
    if (!r) return;
    var mw = +c.dataset.maxw, mh = +c.dataset.maxh, w = mw, h = mw / r;
    if (h > mh) { h = mh; w = mh * r; }
    c.style.width = Math.round(w) + 'px';
    c.style.height = Math.round(h) + 'px';
  }
  if (img.complete) adatta(); else img.addEventListener('load', adatta);
});
</script>
</body>
</html>
